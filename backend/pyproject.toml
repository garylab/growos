[project]
name = "growos-backend"
version = "0.1.0"
description = "GrowOS - AI Customer Acquisition Intelligence Platform (backend API + worker)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.3",
  "pydantic==2.10.3",
  "email-validator==2.2.0",
  "pydantic-settings==2.6.1",
  "httpx==0.28.1",
  "cryptography==44.0.0",
  "structlog==24.4.0",
  "apscheduler==3.10.4",
  "feedparser==6.0.11",
  "selectolax==0.3.27",
  "trafilatura==2.0.0",
  "google-auth==2.36.0",
  "requests==2.32.3",
  "python-multipart==0.0.19",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
